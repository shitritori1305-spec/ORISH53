name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Start server
        working-directory: server
        run: nohup node index.js & sleep 1
      - name: Wait for server
        run: |
          for i in {1..10}; do curl -sSf http://localhost:3000/questionnaire && break || sleep 1; done
      - name: Check questionnaire
        run: curl -sSf http://localhost:3000/questionnaire | jq . >/dev/null
      - name: Check protected answers (should 401 without password)
        run: |
          set -e
          if curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000/answers | grep -q 401; then echo OK; else echo "answers not protected"; exit 1; fi
      - name: Check answers with admin password
        env:
          ADMIN_PASSWORD: admin123
        run: curl -sS -H "X-Admin-Password: $ADMIN_PASSWORD" http://localhost:3000/answers | jq . >/dev/null
